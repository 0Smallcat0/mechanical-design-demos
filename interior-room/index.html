<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>互動 3D 房間：用市售真實家具擺出你的房間</title>
<style>
  :root { --fg:#1d1d1f; --mut:#6e6e73; --line:#d2d2d7; --acc:#e8590c; --bg:#fbfbfd; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; font:15px/1.5 system-ui,-apple-system,"Segoe UI","Microsoft JhengHei",sans-serif; color:var(--fg); background:var(--bg); }
  .app { display:grid; grid-template-columns: 300px 1fr; height:100vh; }
  aside { border-right:1px solid var(--line); padding:16px; overflow:auto; background:#fff; }
  h1 { font-size:18px; margin:0 0 4px; } .sub { color:var(--mut); font-size:13px; margin:0 0 14px; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--mut); margin:18px 0 8px; }
  #catalog button { display:block; width:100%; text-align:left; border:1px solid var(--line); background:#fff; border-radius:10px; padding:8px 10px; margin:0 0 6px; cursor:pointer; font:inherit; }
  #catalog button:hover { border-color:var(--acc); } #catalog b { display:block; font-size:14px; } #catalog span { color:var(--mut); font-size:12px; }
  table { width:100%; border-collapse:collapse; font-size:13px; } td { padding:4px 0; border-bottom:1px solid var(--line); } td:nth-child(2){color:var(--mut);} td:last-child { text-align:right; }
  tr.tot td { font-weight:700; border-bottom:none; }
  .tools button, #info button { font:inherit; padding:6px 12px; border-radius:999px; border:1px solid var(--line); background:#fff; cursor:pointer; margin:0 4px 6px 0; }
  .tools button:hover, #info button:hover { border-color:var(--acc); }
  main { position:relative; } #view { position:absolute; inset:0; }
  #info { position:absolute; right:16px; top:16px; width:280px; background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px; box-shadow:0 6px 24px rgba(0,0,0,.08); }
  #info .n { font-weight:700; font-size:16px; } #info .v, #info .d { color:var(--mut); font-size:13px; } #info .p { font-size:18px; font-weight:700; margin:6px 0; }
  #info a.buy { display:inline-block; background:var(--acc); color:#fff; text-decoration:none; padding:7px 14px; border-radius:999px; font-weight:600; margin:4px 0 8px; }
  #warn { position:absolute; left:16px; top:16px; background:#e05050; color:#fff; padding:6px 12px; border-radius:999px; font-size:13px; }
  .hint { position:absolute; left:16px; bottom:12px; color:var(--mut); font-size:12px; background:rgba(255,255,255,.8); padding:4px 10px; border-radius:8px; }
  .note { color:var(--mut); font-size:12px; margin-top:14px; }
  @media (max-width:760px){ .app{grid-template-columns:1fr; grid-template-rows:auto 60vh;} aside{order:2; border-right:none;} main{order:1;} #info{width:auto; left:12px; right:12px; top:auto; bottom:40px;} }
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1>互動 3D 房間</h1>
    <p class="sub">4.2 × 5.0 m 套房。每件家具都是市面上買得到的商品，照商品頁標示的尺寸建模，點一下看價格與購買連結。</p>
    <div class="tools"><button id="b-top">俯視平面</button><button id="b-reset">回到預設擺法</button></div>
    <h2>加入家具</h2>
    <div id="catalog"></div>
    <h2>購物清單</h2>
    <table id="cart"></table>
    <p class="note">商品名稱、尺寸、價格取自 IKEA 台灣官網商品頁（2026-11-10），價格以官網為準。外形是依尺寸與結構重建的示意模型，不是官方 3D 檔。擺法自動存在這台瀏覽器。</p>
  </aside>
  <main>
    <div id="view"></div>
    <div id="warn" hidden>有家具重疊（紅色）</div>
    <div id="info" hidden>
      <div class="n" id="i-name"></div><div class="v" id="i-var"></div><div class="d" id="i-dim"></div>
      <div class="p" id="i-price"></div>
      <a class="buy" id="i-link" target="_blank" rel="noopener">到商品頁看看</a><br>
      <button id="b-rot">旋轉 90°（R）</button><button id="b-op" hidden></button><button id="b-del">移除</button>
    </div>
    <div class="hint">拖曳家具移動（5 cm 吸附、不會穿牆）· 拖曳空白處轉視角 · 滾輪縮放</div>
  </main>
</div>
