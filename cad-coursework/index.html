<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SolidWorks coursework — interactive 3D · 機械畫作業</title>
<meta name="description" content="Parts I modeled in SolidWorks for Mechanical Drawing, viewable in 3D in the browser.">
<meta property="og:type" content="website">
<meta property="og:title" content="SolidWorks coursework">
<meta property="og:description" content="Parts I modeled in SolidWorks for Mechanical Drawing, in 3D in the browser.">
<meta property="og:image" content="https://0smallcat0.github.io/mechanical-design-demos/cad-coursework/media/card.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="../favicon.svg">
<link rel="stylesheet" href="../style.css">
<style>
.stage { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 760px) { .stage { grid-template-columns: 1fr; } }
#film { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 12px; background: #c8cacd; height: 100%; }
#view { position: relative; aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden; background: #eeeef0; touch-action: none; }
#view canvas { display: block; width: 100%; height: 100%; }
#view.loading::after { content: "Loading…"; position: absolute; inset: auto 0 16px; text-align: center; color: #6e6e73; }
.tools { position: absolute; top: 12px; right: 12px; display: flex; gap: 8px; }
.tools button { font: inherit; font-size: 14px; padding: 6px 12px; border-radius: 999px; border: 1px solid #c7c7cc; background: #fff; color: #1d1d1f; cursor: pointer; }
.tools button[aria-pressed="false"] { opacity: .6; }
.hint { position: absolute; left: 12px; bottom: 10px; font-size: 13px; color: #6e6e73; }
.cap h2 { margin: 8px 0 4px; }
.cap p { margin: 0 0 16px; color: var(--muted); }
.picks { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin: 24px 0 32px; }
.picks:last-child { margin-bottom: 64px; }
.more { font-size: 18px; margin: 8px 0 0; }
.pick { font: inherit; text-align: left; padding: 8px; border: 1px solid var(--line); border-radius: 12px; background: none; color: inherit; cursor: pointer; }
.pick[aria-pressed="true"] { border-color: var(--accent); }
.pick img { border-radius: 8px; }
.pick span { display: block; margin-top: 6px; font-size: 15px; }
</style>
</head>
<body>
<header>
  <a href="../">&larr; All demos · 所有作品</a>
  <h1>SolidWorks coursework · 機械畫作業</h1>
  <p class="lede">Parts I modeled for Mechanical Drawing, shown straight from the SolidWorks part files. <span lang="zh">機械畫課用 SolidWorks 畫的零件。</span></p>
</header>
<main>
  <div class="cap"><h2 id="cap-title"></h2><p id="cap-text"></p></div>
  <div class="stage">
  <video id="film" autoplay muted loop playsinline preload="auto" aria-label="Turntable film of the selected part"></video>
  <div id="view">
    <div class="tools"><button id="edges" aria-pressed="true">Edges</button><button id="reset">Reset view</button></div>
    <div class="hint">Drag to turn · scroll or pinch to zoom</div>
  </div>
  </div>
  <div class="picks">
    <button class="pick" data-id="mug" data-title="Coffee mug · 馬克杯" data-text="Hollow body with a handle curved to fit a hand.">
      <img src="media/mug.jpg" alt="Coffee mug" width="480" height="360"><span>Coffee mug · 馬克杯</span></button>
    <button class="pick" data-id="spur-gear" data-title="Spur gear · 齒輪" data-text="The toothed wheel that passes turning motion from one shaft to another.">
      <img src="media/spur-gear.jpg" alt="Spur gear" width="480" height="360"><span>Spur gear · 齒輪</span></button>
    <button class="pick" data-id="phone" data-title="Smartphone body · 手機" data-text="Rounded corners and a raised camera bump. Same volume as the instructor&#39;s model.">
      <img src="media/phone.jpg" alt="Smartphone body" width="480" height="360"><span>Smartphone body · 手機</span></button>
    <button class="pick" data-id="crankshaft" data-title="Crankshaft · 曲柄軸" data-text="The engine part that turns the pistons&#39; up-and-down motion into rotation.">
      <img src="media/crankshaft.jpg" alt="Crankshaft" width="480" height="360"><span>Crankshaft · 曲柄軸</span></button>
  </div>
  <h2 class="more">More parts from the class · 其他零件</h2>
  <div class="picks">
    <button class="pick" data-id="propeller" data-title="Propeller · 螺旋槳" data-text="Two twisted blades that push air as they spin.">
      <img src="media/propeller.jpg" alt="Propeller" width="480" height="360" loading="lazy"><span>Propeller · 螺旋槳</span></button>
    <button class="pick" data-id="hitch-ball" data-title="Tow hitch ball · 拖車掛勾球" data-text="Slides into the hitch on the back of a car; the trailer hooks onto the ball.">
      <img src="media/hitch-ball.jpg" alt="Tow hitch ball" width="480" height="360" loading="lazy"><span>Tow hitch ball · 拖車掛勾球</span></button>
    <button class="pick" data-id="eye-bolt" data-title="Eye bolt · 吊環螺栓" data-text="A rod bent into a loop for hooking on a rope or chain.">
      <img src="media/eye-bolt.jpg" alt="Eye bolt" width="480" height="360" loading="lazy"><span>Eye bolt · 吊環螺栓</span></button>
    <button class="pick" data-id="flange" data-title="Pipe flange · 法蘭" data-text="A ring that bolts two pipe ends together through its four holes.">
      <img src="media/flange.jpg" alt="Pipe flange" width="480" height="360" loading="lazy"><span>Pipe flange · 法蘭</span></button>
    <button class="pick" data-id="hex-bolt" data-title="Hex bolt · 螺絲" data-text="A bolt with a six-sided head for a wrench.">
      <img src="media/hex-bolt.jpg" alt="Hex bolt" width="480" height="360" loading="lazy"><span>Hex bolt · 螺絲</span></button>
    <button class="pick" data-id="pillow-block" data-title="Pillow block · 連座軸承" data-text="Holds a turning shaft and bolts it down to a base.">
      <img src="media/pillow-block.jpg" alt="Pillow block" width="480" height="360" loading="lazy"><span>Pillow block · 連座軸承</span></button>
    <button class="pick" data-id="keyed-shaft" data-title="Keyed shaft · 鍵軸" data-text="A long shaft with a slot for the key that locks a gear or pulley onto it.">
      <img src="media/keyed-shaft.jpg" alt="Keyed shaft" width="480" height="360" loading="lazy"><span>Keyed shaft · 鍵軸</span></button>
    <button class="pick" data-id="shaft-coupling" data-title="Shaft coupling · 軸聯結器" data-text="Joins the ends of two shafts so they turn together.">
      <img src="media/shaft-coupling.jpg" alt="Shaft coupling" width="480" height="360" loading="lazy"><span>Shaft coupling · 軸聯結器</span></button>
    <button class="pick" data-id="bushing" data-title="Bushing · 襯套" data-text="A stepped sleeve that lines a hole so a shaft can turn inside it.">
      <img src="media/bushing.jpg" alt="Bushing" width="480" height="360" loading="lazy"><span>Bushing · 襯套</span></button>
    <button class="pick" data-id="electronics-cover" data-title="Electronics cover · 電子零件蓋板" data-text="A sheet-metal lid with a grid of vent holes.">
      <img src="media/electronics-cover.jpg" alt="Electronics cover" width="480" height="360" loading="lazy"><span>Electronics cover · 電子零件蓋板</span></button>
    <button class="pick" data-id="muffler-clamp" data-title="Muffler clamp · 滅音器夾" data-text="A sheet-metal clip that holds an exhaust pipe in place.">
      <img src="media/muffler-clamp.jpg" alt="Muffler clamp" width="480" height="360" loading="lazy"><span>Muffler clamp · 滅音器夾</span></button>
    <button class="pick" data-id="sheet-metal-part" data-title="Sheet-metal bracket · 鈑金零件" data-text="Bent into shape from a single flat sheet.">
      <img src="media/sheet-metal-part.jpg" alt="Sheet-metal bracket" width="480" height="360" loading="lazy"><span>Sheet-metal bracket · 鈑金零件</span></button>
    <button class="pick" data-id="locating-pin" data-title="Locating pin · 定位銷" data-text="A bent pin that drops into a hole to hold two parts in line.">
      <img src="media/locating-pin.jpg" alt="Locating pin" width="480" height="360" loading="lazy"><span>Locating pin · 定位銷</span></button>
    <button class="pick" data-id="mirror-bracket" data-title="Mirror bracket · 鏡子支架" data-text="An angled support block with a slot cut through the top.">
      <img src="media/mirror-bracket.jpg" alt="Mirror bracket" width="480" height="360" loading="lazy"><span>Mirror bracket · 鏡子支架</span></button>
    <button class="pick" data-id="frame-bracket" data-title="Frame bracket · 鏡框支架" data-text="An angled block with a slot on top and a window cut through the slope.">
      <img src="media/frame-bracket.jpg" alt="Frame bracket" width="480" height="360" loading="lazy"><span>Frame bracket · 鏡框支架</span></button>
    <button class="pick" data-id="angle-iron" data-title="Angle iron · 角鋼" data-text="An L-shaped steel bar, 1.8 m long.">
      <img src="media/angle-iron.jpg" alt="Angle iron" width="480" height="360" loading="lazy"><span>Angle iron · 角鋼</span></button>
    <button class="pick" data-id="drilled-block" data-title="Drilled block · 方塊" data-text="A class exercise in drawing close-up detail views of small features.">
      <img src="media/drilled-block.jpg" alt="Drilled block" width="480" height="360" loading="lazy"><span>Drilled block · 方塊</span></button>
  </div>
</main>
<script src="js/app.js"></script>
</body>
</html>
